name: build

# 仅在「手动触发」或「发布 Release」时编译。
#
# 刻意不监听 push / pull_request / pull_request_target / schedule / workflow_call，
# 因此普通提交不会触发任何构建，避免浪费 Actions 配额。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "产物版本号（留空则使用提交 SHA）"
        required: false
        default: ""
      draft_release:
        description: "编译完成后创建 Draft Release 并上传产物"
        type: boolean
        required: false
        default: false
  release:
    types: [published]

permissions:
  contents: read

# 同一分支/标签上的构建排队执行，避免两次发布同时上传产物互相覆盖。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # -trimpath 去掉构建机的绝对路径，使相同源码产出相同二进制。
  GOFLAGS: -trimpath
  BINARY: marp

jobs:
  # 编译前先跑一次静态检查与测试，代码有问题就别产出二进制了。
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: 确认代码已格式化
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test ./...

  build:
    name: ${{ matrix.artifact }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, artifact: marp-linux-amd64 }
          - { goos: linux,   goarch: arm64, artifact: marp-linux-arm64 }
          - { goos: linux,   goarch: arm, goarm: "6", artifact: marp-linux-armv6 }
          - { goos: linux,   goarch: arm, goarm: "7", artifact: marp-linux-armv7 }
          - { goos: windows, goarch: amd64, artifact: marp-windows-amd64.exe }
          - { goos: windows, goarch: arm64, artifact: marp-windows-arm64.exe }
          - { goos: darwin,  goarch: amd64, artifact: marp-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, artifact: marp-darwin-arm64 }
          - { goos: android, goarch: arm64, artifact: marp-android-arm64 }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "构建版本: $version"

      - name: 编译
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "dist/${{ matrix.artifact }}" .

      - name: 校验产物
        run: |
          file="dist/${{ matrix.artifact }}"
          test -s "$file" || { echo "产物为空: $file"; exit 1; }
          ls -l "$file"

          # 用 od 比对文件魔数。注意不能直接用 grep 匹配二进制内容，
          # grep 会把二进制当成非文本而匹配失败。
          case "${{ matrix.goos }}" in
            windows) expected="4d5a"; n=2 ;;       # MZ
            darwin)  expected="cffaedfe"; n=4 ;;   # Mach-O 64 (little endian)
            *)       expected="7f454c46"; n=4 ;;   # \x7fELF
          esac
          magic="$(head -c "$n" "$file" | od -An -tx1 | tr -d ' \n')"
          if [ "$magic" != "$expected" ]; then
            echo "产物格式不符: 实际 $magic，期望 $expected"
            exit 1
          fi
          echo "格式校验通过: $expected"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: marp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marp-*
          merge-multiple: true
          path: dist

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # 发布 Release 时：把产物与校验和直接挂到该 Release 上。
  attach-to-release:
    name: 上传到 Release
    needs: [build, checksums]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marp-*
          merge-multiple: true
          path: dist

      - name: 上传产物到 ${{ github.event.release.tag_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          # 必须带 --repo：本 job 只下载了 artifact，没有 checkout，
          # 工作目录下不存在 .git。不指定仓库时 gh 会去调用 git 解析远端并报
          # "fatal: not a git repository"。
          gh release upload "$TAG" ./* --repo "$REPO" --clobber
          gh release view "$TAG" --repo "$REPO" --json tagName,assets --jq '.tagName, (.assets | length)'

  # 手动触发时可选：顺便开一个 Draft Release 方便下载。
  draft-release:
    name: 创建 Draft Release
    needs: [build, checksums]
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marp-*
          merge-multiple: true
          path: dist

      - name: 创建 Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version != '' && inputs.version || format('build-{0}', github.run_id) }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          # 同样需要 --repo，理由同上：工作目录里没有 .git。
          # 标题里的提交哈希要用 GitHub 表达式语法，否则会被 bash 当成命令替换而执行失败。
          gh release create "$TAG" \
            --repo "$REPO" \
            --draft \
            --title "$TAG (${{ github.sha }})" \
            --generate-notes \
            ./*
          echo "已创建 Draft Release: $TAG"
