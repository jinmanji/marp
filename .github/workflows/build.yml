name: build

# 仅在「手动触发」或「发布 Release」时编译。
#
# 刻意不监听 push / pull_request / pull_request_target / schedule / workflow_call，
# 因此普通提交不会触发任何构建，避免浪费 Actions 配额。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "产物版本号（留空则使用提交 SHA）"
        required: false
        default: ""
      draft_release:
        description: "编译完成后创建 Draft Release 并上传产物"
        type: boolean
        required: false
        default: false
  release:
    types: [published]

permissions:
  contents: read

# 同一分支/标签上的构建排队执行，避免两次发布同时上传产物互相覆盖。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # -trimpath 去掉构建机的绝对路径，使相同源码产出相同二进制。
  GOFLAGS: -trimpath
  BINARY: marp

jobs:
  # 编译前先跑一次静态检查与测试，代码有问题就别产出二进制了。
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: 确认代码已格式化
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test ./...

  build:
    name: ${{ matrix.artifact }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, artifact: marp-linux-amd64 }
          - { goos: linux,   goarch: arm64, artifact: marp-linux-arm64 }
          - { goos: linux,   goarch: arm, goarm: "6", artifact: marp-linux-armv6 }
          - { goos: linux,   goarch: arm, goarm: "7", artifact: marp-linux-armv7 }
          - { goos: windows, goarch: amd64, artifact: marp-windows-amd64.exe }
          - { goos: windows, goarch: arm64, artifact: marp-windows-arm64.exe }
          - { goos: darwin,  goarch: amd64, artifact: marp-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, artifact: marp-darwin-arm64 }
          - { goos: android, goarch: arm64, artifact: marp-android-arm64 }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "构建版本: $version"

      - name: 编译
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "dist/${{ matrix.artifact }}" .

      - name: 校验产物
        run: |
          file="dist/${{ matrix.artifact }}"
          test -s "$file" || { echo "产物为空: $file"; exit 1; }
          ls -l "$file"

          # 用 od 比对文件魔数。注意不能直接用 grep 匹配二进制内容，
          # grep 会把二进制当成非文本而匹配失败。
          case "${{ matrix.goos }}" in
            windows) expected="4d5a"; n=2 ;;       # MZ
            darwin)  expected="cffaedfe"; n=4 ;;   # Mach-O 64 (little endian)
            *)       expected="7f454c46"; n=4 ;;   # \x7fELF
          esac
          magic="$(head -c "$n" "$file" | od -An -tx1 | tr -d ' \n')"
          if [ "$magic" != "$expected" ]; then
            echo "产物格式不符: 实际 $magic，期望 $expected"
            exit 1
          fi
          echo "格式校验通过: $expected"

          # 链接格式校验。
          #
          # linux：Alpine/musl 兼容的前提是完全静态、不带 PT_INTERP，
          #        一旦有人打开 cgo 这里会拦住。
          # android：Go 为 Android 生成 PIE，依赖 /system/bin/linker64，
          #        这是预期行为（Android 上该链接器总是存在），所以不能按
          #        静态要求卡它；改为确认解释器确实是 Android 链接器，
          #        而不是意外链到了 glibc。
          #
          # 解释器路径从 .interp 段读取（readelf -p .interp），不要去解析
          # readelf -l 的排版：GNU binutils 与 LLVM 的 readelf 在 INTERP
          # 段后面插入的行数不同，靠 grep -A 提取会随机失效。
          # 静态产物没有该段，readelf 只会往 stderr 写提示，因此丢弃 stderr。
          interp="$(readelf -p .interp "$file" 2>/dev/null | sed -n 's/^\[[^]]*\][[:space:]]*//p' | head -1)"

          case "${{ matrix.goos }}" in
            linux)
              if readelf -l "$file" 2>/dev/null | grep -q INTERP || [ -n "$interp" ]; then
                echo "linux 产物带动态链接器（${interp:-PT_INTERP}），无法在 Alpine/musl 上运行"
                exit 1
              fi
              echo "静态链接检查通过（无 PT_INTERP，Alpine/musl 可运行）"
              ;;
            android)
              case "$interp" in
                /system/bin/linker*)
                  echo "Android PIE，解释器: $interp ✓"
                  ;;
                '')
                  echo "Android 产物缺少 .interp 段（应当是 PIE 形态）"
                  exit 1
                  ;;
                *)
                  echo "Android 产物解释器异常: $interp（期望 /system/bin/linker64）"
                  exit 1
                  ;;
              esac
              ;;
          esac

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          # 必须用 matrix.artifact（文件名）而不是 goos-goarch：
          # armv6 和 armv7 的 goarch 都是 arm，拼出来的 artifact 名完全相同，
          # v4 会把其中一份静默丢弃，导致 Release 少一个附件且不报错。
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  # 实际在 Alpine 里跑一下发布用的二进制。
  # 用 node:20-alpine 而不是 alpine：actions/download-artifact 是 JavaScript
  # action，需要容器里自带 musl 版 Node 才能执行。
  verify-alpine:
    name: 在 Alpine 上运行
    needs: build
    runs-on: ubuntu-latest
    container: node:20-alpine
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marp-linux-amd64
          path: dist

      - name: 在 musl 环境运行
        run: |
          set -eu
          echo "发行版: $(cat /etc/os-release | grep PRETTY_NAME)"
          chmod +x dist/marp-linux-amd64
          ./dist/marp-linux-amd64 version
          ./dist/marp-linux-amd64 --help >/dev/null
          echo "Alpine 运行验证通过"

      - name: 确认产物是静态链接
        run: |
          apk add --no-cache binutils >/dev/null
          if readelf -l dist/marp-linux-amd64 | grep -q INTERP; then
            echo "产物带 PT_INTERP，不是静态链接"
            exit 1
          fi
          echo "确认无 PT_INTERP"

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marp-*
          merge-multiple: true
          path: dist

      - name: 校验产物齐全
        run: |
          expected="marp-linux-amd64 marp-linux-arm64 marp-linux-armv6 marp-linux-armv7 \
                    marp-windows-amd64.exe marp-windows-arm64.exe \
                    marp-darwin-amd64 marp-darwin-arm64 marp-android-arm64"
          missing=""
          for name in $expected; do
            if [ ! -s "dist/$name" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "缺少产物:$missing"
            echo "拒绝继续：产物不完整时不应该发布 Release。"
            exit 1
          fi
          echo "全部产物齐全 ($(echo $expected | wc -w) 个)"

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # 发布 Release 时：把产物与校验和直接挂到该 Release 上。
  attach-to-release:
    name: 上传到 Release
    needs: [build, checksums, verify-alpine]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # 同时取二进制与 checksums artifact，后者不在 marp-* 范围内。
          pattern: |
            marp-*
            checksums
          merge-multiple: true
          path: dist

      - name: 上传产物到 ${{ github.event.release.tag_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          # 必须带 --repo：本 job 只下载了 artifact，没有 checkout，
          # 工作目录下不存在 .git。不指定仓库时 gh 会去调用 git 解析远端并报
          # "fatal: not a git repository"。
          gh release upload "$TAG" ./* --repo "$REPO" --clobber
          gh release view "$TAG" --repo "$REPO" --json tagName,assets --jq '.tagName, (.assets | length)'

  # 手动触发时可选：顺便开一个 Draft Release 方便下载。
  draft-release:
    name: 创建 Draft Release
    needs: [build, checksums, verify-alpine]
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: |
            marp-*
            checksums
          merge-multiple: true
          path: dist

      - name: 创建 Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version != '' && inputs.version || format('build-{0}', github.run_id) }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          # 同样需要 --repo，理由同上：工作目录里没有 .git。
          # 标题里的提交哈希要用 GitHub 表达式语法，否则会被 bash 当成命令替换而执行失败。
          gh release create "$TAG" \
            --repo "$REPO" \
            --draft \
            --title "$TAG (${{ github.sha }})" \
            --generate-notes \
            ./*
          echo "已创建 Draft Release: $TAG"
