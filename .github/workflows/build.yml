name: build
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo t
  build:
    name: ${{ matrix.artifact }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, artifact: marp-linux-amd64 }
    steps:
      - uses: actions/checkout@v4
      - run: echo build
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marp-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum ./* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  attach-to-release:
    name: 上传到 Release
    needs: [build, checksums]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marp-*
          merge-multiple: true
          path: dist
      - name: 上传产物
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: cd dist && gh release upload "$TAG" ./* --clobber
  draft-release:
    name: 创建 Draft Release
    needs: [build, checksums]
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marp-*
          merge-multiple: true
          path: dist
      - name: 创建 Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version != '' && inputs.version || format('build-{0}', github.run_id) }}
        run: echo "$TAG"
